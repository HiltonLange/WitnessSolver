name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build WitnessSolver.sln --configuration Release

      - name: Solve all puzzles (correctness + timing)
        run: dotnet run --project WitnessSolver.TimingHarness --configuration Release --no-build -- Long

      - name: Upload perf results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results.json
